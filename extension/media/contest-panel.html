<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__';">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 12px;
        font-family: var(--vscode-font-family);
        font-size: 13px;
        color: var(--vscode-foreground);
    }
    .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin: 56px 0;
        text-align: center;
        color: var(--vscode-descriptionForeground);
    }
    .head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .contest-name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .badge {
        padding: 1px 8px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
    }
    .badge.idle { color: var(--vscode-descriptionForeground); border-color: var(--vscode-descriptionForeground); }
    .badge.running { color: var(--vscode-testing-iconPassed); border-color: var(--vscode-testing-iconPassed); }
    .badge.paused { color: var(--vscode-list-warningForeground); border-color: var(--vscode-list-warningForeground); }
    .badge.ended { color: var(--vscode-testing-iconFailed); border-color: var(--vscode-testing-iconFailed); }
    .timer { display: flex; gap: 20px; margin: 12px 0; }
    .timer .item { display: flex; flex-direction: column; gap: 2px; }
    .timer .item span { font-size: 11px; color: var(--vscode-descriptionForeground); }
    .timer .item b { font-size: 18px; font-variant-numeric: tabular-nums; }
    .timer .item b.over { color: var(--vscode-list-warningForeground); }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .running-note { margin-left: 6px; font-size: 11px; color: var(--vscode-descriptionForeground); }
    button {
        font-family: inherit;
        font-size: 12px;
        color: var(--vscode-button-foreground);
        background: var(--vscode-button-background);
        border: 1px solid transparent;
        border-radius: 3px;
        padding: 4px 10px;
        cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }
    button:disabled { opacity: .5; cursor: default; }
    button.secondary {
        color: var(--vscode-button-secondaryForeground);
        background: var(--vscode-button-secondaryBackground);
    }
    button.secondary:hover:not(:disabled) { background: var(--vscode-button-secondaryHoverBackground); }
    section {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 12px;
        border-top: 1px solid var(--vscode-panel-border);
        margin-top: 12px;
    }
    .section-head { display: flex; align-items: center; gap: 8px; }
    .section-head h4 { flex: 1 1 auto; }
    h4 {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .04em;
        color: var(--vscode-descriptionForeground);
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--vscode-panel-border); }
    th { color: var(--vscode-descriptionForeground); font-weight: 600; }
    tr.self {
        color: var(--vscode-list-activeSelectionForeground);
        background: var(--vscode-list-activeSelectionBackground);
    }
    .mono { font-family: var(--vscode-editor-font-family); }
    .tnum { font-variant-numeric: tabular-nums; }
    .muted { color: var(--vscode-descriptionForeground); }
    .freeze-note { font-size: 11px; color: var(--vscode-list-warningForeground); }
    .st-ok { color: var(--vscode-testing-iconPassed); }
    .st-try { color: var(--vscode-list-warningForeground); }
    .st-none { color: var(--vscode-descriptionForeground); }
    .opponent-form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    input {
        font-family: inherit;
        font-size: 12px;
        color: var(--vscode-input-foreground);
        background: var(--vscode-input-background);
        border: 1px solid var(--vscode-input-border, var(--vscode-panel-border));
        border-radius: 3px;
        padding: 4px 6px;
    }
    input[type="number"] { width: 90px; }
    .toast {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        padding: 8px 10px;
        border: 1px solid var(--vscode-panel-border);
        border-radius: 4px;
        font-size: 12px;
        color: var(--vscode-foreground);
        background: var(--vscode-editorWidget-background);
    }
    .toast.info { border-color: var(--vscode-testing-iconPassed); }
    .toast.warn { border-color: var(--vscode-list-warningForeground); }
</style>
</head>
<body>
    <div class="empty" id="empty">
        <span>未载入比赛</span>
        <button id="load-empty">载入比赛目录</button>
    </div>
    <div id="main" style="display: none;">
        <div class="head">
            <strong class="contest-name" id="contest-name">-</strong>
            <span class="badge idle" id="badge">未开始</span>
            <button class="secondary" id="load-main">重新载入</button>
        </div>
        <div class="timer">
            <div class="item"><span>已用</span><b id="elapsed">00:00:00</b></div>
            <div class="item"><span>剩余</span><b id="remaining">00:00:00</b></div>
        </div>
        <div class="controls">
            <button id="btn-start">开始</button>
            <button class="secondary" id="btn-pause">暂停</button>
            <button class="secondary" id="btn-end">结束</button>
            <button class="secondary" id="btn-reset">重置</button>
            <span class="running-note" id="running-note"></span>
        </div>
        <section>
            <h4>题目</h4>
            <table>
                <thead>
                    <tr><th>题号</th><th>状态</th><th>AC时间(分钟)</th><th>错误次数</th><th>罚时</th><th>操作</th></tr>
                </thead>
                <tbody id="problems"></tbody>
            </table>
        </section>
        <section>
            <div class="section-head">
                <h4>榜单</h4>
                <span class="freeze-note" id="freeze-note"></span>
                <button class="secondary" id="btn-add-opponent">添加对手队伍</button>
            </div>
            <table>
                <thead>
                    <tr><th>名次</th><th>队伍</th><th>通过数</th><th>罚时</th></tr>
                </thead>
                <tbody id="ranklist"></tbody>
            </table>
            <form class="opponent-form" id="opponent-form" style="display: none;">
                <input id="op-name" type="text" placeholder="队名" />
                <input id="op-solved" type="number" min="0" value="0" placeholder="通过数" />
                <input id="op-penalty" type="number" min="0" value="0" placeholder="罚时" />
                <button type="submit">添加</button>
            </form>
        </section>
    </div>
    <div class="toast" id="toast" style="display: none;"></div>
<script nonce="__NONCE__">
    const vscodeApi = acquireVsCodeApi();
    const STATUS_TEXT = { idle: '未开始', running: '进行中', paused: '已暂停', ended: '已结束' };
    let snapshot = null;
    let receivedAt = 0;
    let toastTimer = null;
    let freezeRequested = false;

    function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function pad2(n) {
        return (n < 10 ? '0' : '') + n;
    }

    function hhmmss(ms) {
        const total = Math.max(0, Math.floor((ms || 0) / 1000));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        return pad2(h) + ':' + pad2(m) + ':' + pad2(s);
    }

    function computeFrozen(elapsed) {
        const cfg = snapshot && snapshot.config;
        if (!cfg || !(cfg.freezeMinutes > 0)) {
            return false;
        }
        if (!snapshot.state || snapshot.state.status !== 'running') {
            return false;
        }
        return elapsed >= (cfg.durationMinutes - cfg.freezeMinutes) * 60000;
    }

    function tick() {
        if (!snapshot || !snapshot.config) {
            return;
        }
        const running = snapshot.state && snapshot.state.status === 'running';
        const delta = running ? Date.now() - receivedAt : 0;
        const elapsed = (snapshot.elapsedMs || 0) + delta;
        const remaining = snapshot.config.durationMinutes * 60000 - elapsed;
        const liveFrozen = computeFrozen(elapsed);
        if (liveFrozen !== !!snapshot.frozen && freezeRequested !== liveFrozen) {
            freezeRequested = liveFrozen;
            vscodeApi.postMessage({ type: 'refresh' });
        }
        document.getElementById('elapsed').textContent = hhmmss(elapsed);
        const remEl = document.getElementById('remaining');
        if (remaining < 0) {
            remEl.textContent = '-' + hhmmss(-remaining);
            remEl.classList.add('over');
        } else {
            remEl.textContent = hhmmss(remaining);
            remEl.classList.remove('over');
        }
    }

    function setJudgeButtonsDisabled(disabled) {
        const body = document.getElementById('problems');
        Array.prototype.forEach.call(body.querySelectorAll('.judge-btn'), function (btn) {
            if (disabled) {
                btn.disabled = true;
            } else {
                btn.disabled = btn.getAttribute('data-available') !== '1';
            }
        });
    }

    function renderProblems(config) {
        const body = document.getElementById('problems');
        if (!config || !config.problems || !config.problems.length) {
            body.innerHTML = '<tr><td colspan="6" class="muted">无题目</td></tr>';
            return;
        }
        const statsMap = {};
        (snapshot.problemStats || []).forEach(function (s) {
            statsMap[s.label] = s;
        });
        body.innerHTML = config.problems.map(function (p) {
            const st = statsMap[p.label] || { label: p.label, solved: false, wrongCount: 0, penalty: 0 };
            let statusText;
            let statusCls;
            if (st.solved) {
                statusText = '已通过';
                statusCls = 'st-ok';
            } else if (st.wrongCount > 0) {
                statusText = '尝试中';
                statusCls = 'st-try';
            } else {
                statusText = '未提交';
                statusCls = 'st-none';
            }
            const acTime = st.solved && st.acMinute !== undefined ? String(st.acMinute) : '—';
            const penalty = st.solved ? String(st.penalty) : '—';
            const label = escapeHtml(p.label);
            const titleSuffix = p.title && p.title !== p.label ? '<span class="muted"> ' + escapeHtml(p.title) + '</span>' : '';
            const note = p.available ? '' : ' title="题目目录不可用"';
            return '<tr>'
                + '<td class="mono">' + label + titleSuffix + '</td>'
                + '<td class="' + statusCls + '">' + statusText + '</td>'
                + '<td class="tnum">' + acTime + '</td>'
                + '<td class="tnum">' + st.wrongCount + '</td>'
                + '<td class="tnum">' + penalty + '</td>'
                + '<td><button class="judge-btn" data-label="' + label + '" data-available="' + (p.available ? '1' : '0') + '"' + (p.available ? '' : ' disabled') + note + '>评测</button></td>'
                + '</tr>';
        }).join('');
        Array.prototype.forEach.call(body.querySelectorAll('.judge-btn'), function (btn) {
            btn.addEventListener('click', function () {
                if (btn.disabled) {
                    return;
                }
                vscodeApi.postMessage({ type: 'judge', label: btn.getAttribute('data-label') });
                setJudgeButtonsDisabled(true);
            });
        });
    }

    function renderRanklist() {
        const body = document.getElementById('ranklist');
        const rows = snapshot.ranklist || [];
        if (!rows.length) {
            body.innerHTML = '<tr><td colspan="4" class="muted">暂无</td></tr>';
            return;
        }
        body.innerHTML = rows.map(function (r, i) {
            return '<tr class="' + (r.isSelf ? 'self' : '') + '">'
                + '<td class="tnum">' + (i + 1) + '</td>'
                + '<td>' + escapeHtml(r.name) + '</td>'
                + '<td class="tnum">' + r.solved + '</td>'
                + '<td class="tnum">' + r.penalty + '</td>'
                + '</tr>';
        }).join('');
    }

    function render() {
        const empty = document.getElementById('empty');
        const main = document.getElementById('main');
        if (!snapshot) {
            empty.style.display = '';
            main.style.display = 'none';
            return;
        }
        empty.style.display = 'none';
        main.style.display = '';
        const config = snapshot.config;
        document.getElementById('contest-name').textContent = config ? config.name : '未载入比赛';
        const status = snapshot.state ? snapshot.state.status : 'idle';
        const badge = document.getElementById('badge');
        badge.className = 'badge ' + status;
        badge.textContent = STATUS_TEXT[status] || status;
        document.getElementById('btn-start').disabled = status === 'running' || status === 'ended';
        document.getElementById('btn-pause').disabled = status !== 'running';
        document.getElementById('btn-end').disabled = status === 'idle' || status === 'ended';
        document.getElementById('btn-reset').disabled = false;
        document.getElementById('running-note').textContent = '';
        const freezeNote = document.getElementById('freeze-note');
        if (snapshot.frozen && config) {
            freezeNote.textContent = '已封榜 (冻结于 ' + hhmmss((config.durationMinutes - config.freezeMinutes) * 60000) + ')';
        } else if (config && config.freezeMinutes > 0 && status === 'ended') {
            freezeNote.textContent = '已解榜';
        } else {
            freezeNote.textContent = '';
        }
        renderProblems(config);
        renderRanklist();
        tick();
    }

    function showToast(level, message) {
        const el = document.getElementById('toast');
        el.className = 'toast ' + (level === 'warn' ? 'warn' : 'info');
        el.textContent = message;
        el.style.display = '';
        if (toastTimer) {
            clearTimeout(toastTimer);
        }
        toastTimer = setTimeout(function () {
            el.style.display = 'none';
        }, 4000);
    }

    document.getElementById('load-empty').addEventListener('click', function () {
        vscodeApi.postMessage({ type: 'load' });
    });
    document.getElementById('load-main').addEventListener('click', function () {
        vscodeApi.postMessage({ type: 'load' });
    });
    document.getElementById('btn-start').addEventListener('click', function () {
        vscodeApi.postMessage({ type: 'start' });
    });
    document.getElementById('btn-pause').addEventListener('click', function () {
        vscodeApi.postMessage({ type: 'pause' });
    });
    document.getElementById('btn-end').addEventListener('click', function () {
        vscodeApi.postMessage({ type: 'end' });
    });
    document.getElementById('btn-reset').addEventListener('click', function () {
        vscodeApi.postMessage({ type: 'reset' });
    });
    document.getElementById('btn-add-opponent').addEventListener('click', function () {
        const form = document.getElementById('opponent-form');
        form.style.display = form.style.display === 'none' ? '' : 'none';
    });
    document.getElementById('opponent-form').addEventListener('submit', function (event) {
        event.preventDefault();
        const name = document.getElementById('op-name').value;
        const solved = Number(document.getElementById('op-solved').value) || 0;
        const penalty = Number(document.getElementById('op-penalty').value) || 0;
        vscodeApi.postMessage({ type: 'addOpponent', name: name, solved: solved, penalty: penalty });
        document.getElementById('op-name').value = '';
        document.getElementById('op-solved').value = '0';
        document.getElementById('op-penalty').value = '0';
        document.getElementById('opponent-form').style.display = 'none';
    });

    window.addEventListener('message', function (event) {
        const message = event.data;
        if (!message) {
            return;
        }
        if (message.type === 'state') {
            snapshot = message.payload;
            receivedAt = Date.now();
            freezeRequested = !!(snapshot && snapshot.frozen);
            render();
        } else if (message.type === 'running') {
            setJudgeButtonsDisabled(true);
            document.getElementById('running-note').textContent = '评测 ' + message.label + ' 中...';
        } else if (message.type === 'toast') {
            showToast(message.level, message.message);
        }
    });

    setInterval(tick, 1000);
    vscodeApi.postMessage({ type: 'ready' });
</script>
</body>
</html>
